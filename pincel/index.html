<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ink to colour</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./preview.css">
</head>
<body>
  <main>
    <h1 class="visually-hidden">Ink to colour</h1>
    <section class="track" aria-label="Scroll to scrub the brush reveal">
      <div class="pin">
        <div id="stage">
          <img src="./assets/sketch-desktop.avif" alt="" width="1600" height="1000" fetchpriority="high">
          <canvas aria-hidden="true"></canvas>
        </div>
      </div>
    </section>
  </main>
  <div class="scrub">
    <div class="scrub-label"><label for="scrub">Progress</label><output for="scrub">0%</output></div>
    <input id="scrub" type="range" min="0" max="1" value="0" step="0.001" aria-valuetext="0%">
  </div>
  <nav class="proto-picker" aria-label="Prototype variants">
    <span class="proto-picker-highlight" aria-hidden="true"></span>
    <button class="proto-picker-item" data-active aria-current="true">Broad stroke</button>
    <button class="proto-picker-item">Sumi-e</button>
    <button class="proto-picker-item">Dry brush</button>
    <span class="proto-picker-divider" aria-hidden="true"></span>
    <button class="proto-picker-item proto-picker-replay" aria-label="Reset scrub (R)">&#8635;</button>
  </nav>
  <noscript><p class="message">Enable JavaScript to scrub the reveal.</p></noscript>
  <script type="module">
    import { createBrushReveal } from './brush-reveal.mjs';

    const track = document.querySelector('.track');
    const pin = document.querySelector('.pin');
    const stage = document.getElementById('stage');
    const canvas = stage.querySelector('canvas');
    const picker = document.querySelector('.proto-picker');
    const highlight = picker.querySelector('.proto-picker-highlight');
    const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
    const replay = picker.querySelector('.proto-picker-replay');
    const slider = document.getElementById('scrub');
    const percent = document.querySelector('output');
    const capture = new URLSearchParams(location.search).has('capture');
    document.body.classList.toggle('capture', capture);

    let current = 0;
    let progress = 0;
    let raf = 0;
    let reveal;

    function picture(path) {
      const image = new Image();
      image.src = './assets/' + path;
      return image.decode().then(() => image);
    }

    async function inkPlate() {
      const sketch = stage.querySelector('img');
      const [ink] = await Promise.all([
        fetch('./assets/hero-ink.json').then((response) => {
          if (!response.ok) throw new Error('Ink paths could not load');
          return response.json();
        }),
        sketch.decode(),
      ]);
      const plate = document.createElement('canvas');
      [plate.width, plate.height] = ink.viewBox;
      const pen = plate.getContext('2d', { alpha: false });
      pen.fillStyle = '#e8e2d4';
      pen.fillRect(0, 0, plate.width, plate.height);
      pen.drawImage(sketch, 0, 0, plate.width, plate.height);
      pen.strokeStyle = '#1d1813';
      pen.lineWidth = 2.6;
      pen.lineCap = 'round';
      pen.lineJoin = 'round';
      for (const { d } of ink.paths) pen.stroke(new Path2D(d));
      return plate;
    }

    const assets = Promise.all([inkPlate(), picture('photo-desktop.avif'), picture('brush.png')]);

    function paint(value) {
      progress = Math.max(0, Math.min(1, value));
      slider.value = progress;
      const label = Math.round(progress * 100) + '%';
      if (label !== percent.value) {
        percent.value = label;
        slider.setAttribute('aria-valuetext', label);
      }
      reveal?.set(progress);
    }

    function travel() {
      return track.offsetHeight - pin.offsetHeight;
    }

    function seek(value) {
      paint(value);
      if (!capture) window.scrollTo({ top: track.offsetTop + travel() * progress, behavior: 'instant' });
    }

    function syncScroll() {
      raf = 0;
      const span = travel();
      paint(span > 0 ? -track.getBoundingClientRect().top / span : 0);
    }

    function requestScroll() {
      if (!raf) raf = requestAnimationFrame(syncScroll);
    }

    function moveHighlight() {
      const el = items[current];
      highlight.style.width = el.offsetWidth + 'px';
      highlight.style.transform = 'translateX(' + el.offsetLeft + 'px)';
    }

    async function setActive(index) {
      current = index >= 0 && index < items.length ? index : 0;
      items.forEach((el, j) => {
        el.toggleAttribute('data-active', j === current);
        if (j === current) el.setAttribute('aria-current', 'true');
        else el.removeAttribute('aria-current');
      });
      moveHighlight();

      const url = new URL(location);
      url.searchParams.set('v', current + 1);
      history.replaceState(null, '', url);
      const selected = current;
      const [from, to, brush] = await assets;
      if (selected !== current) return;
      reveal?.destroy();
      reveal = createBrushReveal({ canvas, from, to, brush, variant: 'abc'[selected] });
      reveal.set(progress);
      stage.dataset.ready = '';
    }

    items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
    replay.addEventListener('click', () => seek(0));
    slider.addEventListener('input', () => seek(Number(slider.value)));
    window.addEventListener('resize', moveHighlight);
    if (!capture) {
      window.addEventListener('scroll', requestScroll, { passive: true });
      window.addEventListener('resize', requestScroll, { passive: true });
      syncScroll();
    }

    document.addEventListener('keydown', (event) => {
      if (/^(INPUT|TEXTAREA|SELECT)$/.test(event.target.tagName) || event.target.isContentEditable) return;
      if (event.metaKey || event.ctrlKey || event.altKey) return;
      const num = Number.parseInt(event.key, 10);
      if (num >= 1 && num <= items.length) setActive(num - 1);
      else if (event.key === 'ArrowRight') setActive((current + 1) % items.length);
      else if (event.key === 'ArrowLeft') setActive((current - 1 + items.length) % items.length);
      else if (event.key.toLowerCase() === 'r') seek(0);
    });

    const ready = setActive((Number.parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
    ready.catch((error) => {
      const message = document.createElement('p');
      message.className = 'message';
      message.textContent = 'The reveal assets could not load. Serve this directory over HTTP.';
      document.body.append(message);
      console.error(error);
    });
    requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
    if (capture) window.preview = { ready, select: setActive, set: (value) => reveal.set(value), canvas, sources: assets };
  </script>
</body>
</html>
